[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orbitaly"
version = "0.1.0"
description = "Antenna tracker control software for amateur-radio ground stations: orbital prediction, pass scheduling, and direct stepper-motor az/el rotator control."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "skyfield>=1.48",
    "sgp4>=2.23",
    # Skyfield pulls numpy in anyway, but the predictor's vectorized ground
    # tracks use it directly, so it is declared rather than assumed.
    "numpy>=1.24",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# The reference deployment: the Pi talks to an Arduino over USB, and the
# Arduino's pins drive the step/dir inputs. See firmware/ and docs/HARDWARE.md.
serial = ["pyserial>=3.5"]
# Raspberry Pi GPIO, for a direct-wired build with no Arduino in the loop.
# lgpio talks to the kernel gpiochip character device, which is the only
# supported path on a Pi 5 (RPi.GPIO and pigpio cannot work there).
pi = ["lgpio>=0.2.2.0"]
pi5 = ["lgpio>=0.2.2.0"]
gpio = ["lgpio>=0.2.2.0"]  # deprecated alias, kept so old install docs still work
dev = ["pytest>=8.0"]

[project.scripts]
orbitaly = "orbitaly.__main__:main"

[tool.setuptools.packages.find]
include = ["orbitaly*"]

[tool.setuptools.package-data]
orbitaly = ["static/*", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpiosim: needs the kernel's gpio-sim module (real gpiochips in software)",
    "hardware: needs a real Raspberry Pi with the rotator wired up",
]
