# Orbitaly configuration — copy to config.yaml and edit.
# Every key is optional; anything omitted uses the built-in default.

station:
  name: "Home QTH"
  # Set these to your real position before trusting anything on screen. The
  # map view draws its range ring, its in-view highlighting and every
  # elevation number from here, so a placeholder QTH is not merely imprecise —
  # it is confidently wrong.
  latitude: 40.4406        # decimal degrees, north positive
  longitude: -79.9959      # decimal degrees, east positive
  altitude_m: 300

  # The lowest elevation you can actually work: trees, terrain, local noise.
  # This is a horizon, not a link budget — a 6-element yagi on LEO is
  # geometry-limited, not gain-limited, so the horizon is what sets range.
  # The map takes the higher of this and tracker.min_elevation_deg, so it can
  # never promise a pass the tracker itself would refuse to schedule.
  min_workable_elevation_deg: 5.0

  # What the radio can reach. A satellite is only shown as in view if one of
  # its transponders lands in one of these ranges — which is what stops the
  # map offering SO-50 (436.795 MHz downlink) to a 2 m-only station. Listing
  # a band with `tx: false` describes a receive-only capability, and the map
  # will say "receive only" rather than claiming a two-way contact.
  bands:
    - {min_hz: 144000000, max_hz: 148000000, tx: true, rx: true}
    # A 70 cm station would add:
    # - {min_hz: 430000000, max_hz: 440000000, tx: true, rx: true}

tle:
  sources:
    - "https://celestrak.org/NORAD/elements/gp.php?GROUP=amateur&FORMAT=tle"
    # Add more URLs (any 2LE/3LE text) and they are merged:
    # - "https://celestrak.org/NORAD/elements/gp.php?GROUP=cubesat&FORMAT=tle"
  refresh_hours: 6
  # cache_path: /var/lib/orbitaly/tle.json

tracker:
  update_rate_s: 1.0       # how often the rotator is retargeted while tracking
  min_elevation_deg: 5.0   # passes peaking below this are hidden in the UI
  pass_lookahead_hours: 24
  park: {az: 0, el: 90}    # birds-up park position sheds rain and snow

# 2 m band working frequencies for the live doppler readout (144–148 MHz).
# Changeable at runtime from the dashboard; these are the startup defaults.
doppler_2m:
  uplink_hz: 145990000     # TX: what you dial so the satellite hears this frequency
  downlink_hz: 145800000   # RX: what the satellite transmits; readout shows where to tune

server:
  host: 0.0.0.0
  port: 8000
  # Speak hamlib's rotator protocol so gpredict and friends can drive Orbitaly.
  rotctld:
    enabled: false
    host: 0.0.0.0
    port: 4533

# Radio control for automatic doppler tuning, via hamlib's rigctld.
# Start the daemon separately, e.g.:  rigctld -m 3081 -r /dev/ttyUSB0
rig:
  backend: none            # none | rigctld | simulated
  host: 127.0.0.1
  port: 4532
  tx_vfo: VFOB             # satellite full duplex: RX on the main VFO, TX on this one
  uplink_hz: 0             # 0 = follow the 2 m panel above
  downlink_hz: 0
  enabled: true            # tune as soon as a satellite is tracked
  tune_rx: true
  tune_tx: true
  tune_while_tx: true      # set false if your rig clicks when retuned mid-transmission
  max_tune_rate_hz: 2      # cap on CAT writes per second
  resolution_hz: 1
  min_elevation_deg: -1
  # How far the corrected frequency may drift before retuning, by mode.
  deadbands_hz: {CW: 10, USB: 20, LSB: 20, FM: 200, default: 20}

# Unattended operation: work the best pass, then the next one.
scheduler:
  enabled: false
  satellites: []
    # - {norad_id: 25544, priority: 2}          # ISS first, whatever else is up
    # - {norad_id: 43017, min_elevation_deg: 20}  # FOX-1D, but only good passes
  lookahead_hours: 12
  replan_interval_s: 600
  preposition_lead_s: 120  # engage tracking this long before AOS
  park_after_idle_s: 0     # 0 = stay put between passes

rotator:
  # auto     pick the best backend for this machine: an Arduino running our
  #          firmware if one is plugged in, else lgpio on a Pi, else simulated
  # serial   Pi ──USB──▶ Arduino ──step/dir──▶ drivers. The reference build.
  # lgpio    Raspberry Pi driving the step/dir inputs from its own GPIO — for a
  #          direct-wired build with no Arduino. The only supported *Pi-side*
  #          hardware path on a Pi 5, since RPi.GPIO and pigpio cannot run there
  # pio      RP1 PIO, hardware-timed (not implemented yet — see docs/HARDWARE.md)
  # simulated  no hardware, but the full planner and safety logic
  backend: auto
  gpiochip: -1             # -1 = find the header chip by label (it renumbers between kernels)

  # -- the USB link to the Arduino (backend: serial only) -----------------
  # The Arduino is an exact pulse executor and nothing more: it holds no gear
  # ratios, no travel limits, no speeds. Those all stay below, on the Pi.
  # Its *pin* assignments are the one genuinely per-build hardware fact, and
  # they live in firmware/orbitaly_rotator/pins.h — the per-axis `pins:` keys
  # below are ignored on this backend, and `orbitaly doctor` warns if you set
  # them anyway. The firmware reports its pinout in the handshake, so doctor
  # prints what the board is really running.
  serial:
    port: auto             # or /dev/serial/by-id/usb-Arduino... — by-id survives a replug,
                           # and auto only ever opens a device that identifies as an Arduino
    baud: 115200
    connect_timeout_s: 5   # covers the ~2 s bootloader delay after opening the port resets the board

  # -- safety -------------------------------------------------------------
  estop_pin: -1            # BCM pin, wired normally-closed to ground; -1 = none
  require_homing: null     # null = required on hardware, not in simulation
  idle_disable_s: 0        # release motor current after this long at rest (0 = hold)
  watchdog_s: 5            # stop if whatever is steering stops heartbeating

  # -- the axes themselves ------------------------------------------------
  # Everything here is a fact about the *mechanism*, so it stays on the Pi
  # whichever backend emits the pulses. `pins:` is the exception: it is Pi BCM
  # numbering and applies to backend: lgpio only (see rotator.serial above).
  azimuth:
    min_deg: -90           # extended travel avoids mid-pass 360° slews
    max_deg: 450
    max_speed_dps: 6
    accel_dps2: 4
    steps_per_rev: 200     # motor full steps per revolution
    microsteps: 8          # driver microstepping setting
    gear_ratio: 60         # output degrees = motor degrees / gear_ratio
    backlash_deg: 0.0
    invert_dir: false
    home_position_deg: 0
    pins: {step: 17, dir: 27, enable: 22, endstop: 5}   # -1 = not wired
    # Pulse shaping — from the driver datasheet. Defaults suit A4988/DRV8825/TMC2209.
    start_speed_sps: 8          # crawl rate the axis can start and stop at instantly
    pulse_width_us: 5           # step pulse high time
    dir_setup_us: 20            # settle time after a direction change
    enable_active_low: true
    segment_ms: 20              # motion handed to hardware per segment
    endstop_normally_closed: true   # NC fails safe: a cut wire reads as a trip
    endstop_debounce_ms: 5
    home_backoff_deg: 1.0       # back off and re-approach slowly, for repeatability

  elevation:
    min_deg: 0
    max_deg: 180           # 180° allows flipped-over passes
    max_speed_dps: 4
    accel_dps2: 4
    steps_per_rev: 200
    microsteps: 8
    gear_ratio: 40
    backlash_deg: 0.0
    invert_dir: false
    home_position_deg: 0
    pins: {step: 23, dir: 24, enable: 25, endstop: 6}

# Add or override transponder entries per NORAD id:
# transponder_overrides:
#   "25544":
#     - {name: "FM Voice", mode: "FM", uplink_hz: 145990000, downlink_hz: 437800000}
