<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orbitaly — Ground Station</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div class="brand">🛰 <b>Orbitaly</b> <span id="station-name" class="dim"></span></div>
    <div class="header-right">
      <span id="tle-info" class="dim"></span>
      <button id="tle-refresh" class="btn small">Refresh TLEs</button>
      <span id="conn-dot" class="dot offline" title="WebSocket"></span>
    </div>
  </header>

  <main>
    <section class="panel" id="sat-panel">
      <div class="panel-title">
        <span>Satellites</span>
        <input id="sat-search" type="search" placeholder="filter…">
      </div>
      <div id="sat-list" class="scroll"></div>
    </section>

    <section class="panel" id="sky-panel">
      <div class="panel-title"><span>Sky view</span><span id="tracker-chip" class="chip idle">idle</span></div>
      <canvas id="skyplot" width="520" height="520"></canvas>
      <div id="tracked-info"></div>
      <div id="passes-box">
        <div class="panel-title"><span id="passes-title">Upcoming passes</span></div>
        <div id="pass-list" class="scroll"></div>
      </div>
    </section>

    <section class="panel" id="ctl-panel">
      <div class="panel-title"><span>Rotator</span><span id="rot-moving" class="chip idle">stopped</span></div>
      <div class="readouts">
        <div class="readout"><label>Azimuth</label><div id="rd-az" class="big">—</div><div id="rd-az-t" class="dim small-text"></div></div>
        <div class="readout"><label>Elevation</label><div id="rd-el" class="big">—</div><div id="rd-el-t" class="dim small-text"></div></div>
      </div>
      <div id="rot-fault" class="fault"></div>
      <div id="wrap-warning" class="fault"></div>

      <div class="jog-grid">
        <span></span><button class="btn jog" data-daz="0" data-del="5">El +5°</button><span></span>
        <button class="btn jog" data-daz="-5" data-del="0">Az −5°</button>
        <button class="btn jog" data-daz="0" data-del="0.5">+0.5°</button>
        <button class="btn jog" data-daz="5" data-del="0">Az +5°</button>
        <button class="btn jog" data-daz="-0.5" data-del="0">−0.5°</button>
        <button class="btn jog" data-daz="0" data-del="-5">El −5°</button>
        <button class="btn jog" data-daz="0.5" data-del="0">+0.5°</button>
      </div>

      <form id="goto-form" class="goto-row">
        <input id="goto-az" type="number" step="0.1" placeholder="az°" required>
        <input id="goto-el" type="number" step="0.1" placeholder="el°" required>
        <button class="btn" type="submit">Goto</button>
      </form>

      <div class="button-row">
        <button id="btn-stop" class="btn danger">Stop</button>
        <button id="btn-park" class="btn">Park</button>
        <button id="btn-home" class="btn">Home</button>
        <button id="btn-untrack" class="btn">Stop tracking</button>
      </div>

      <div id="doppler-box"></div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
