<!DOCTYPE html>
<!-- data-theme is rewritten per request from ui.theme in the config file. -->
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orbitaly — Ground Station</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='3' fill='%233987e5'/%3E%3Cellipse cx='8' cy='8' rx='7' ry='2.6' fill='none' stroke='%23898781' stroke-width='1' transform='rotate(-20 8 8)'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div class="brand">
      <span class="mark">ORBITALY</span>
      <span class="sub">ground station</span>
      <span id="station-name" class="dim small-text"></span>
    </div>
    <div class="header-right">
      <span id="tle-info" class="dim small-text"></span>
      <button id="tle-refresh" class="btn small">Refresh TLEs</button>
      <span id="conn" class="conn"><span class="dot"></span><span id="conn-label">offline</span></span>
    </div>
  </header>

  <main>
    <section class="panel" id="sat-panel">
      <div class="panel-title">
        <span>Satellites</span>
        <input id="sat-search" type="search" placeholder="Filter">
      </div>
      <div id="sat-list" class="scroll"></div>
    </section>

    <section class="panel" id="sky-panel">
      <div class="panel-title">
        <span class="view-tabs" role="tablist" aria-label="Center view">
          <button class="view-tab" id="tab-sky" role="tab" aria-controls="view-sky" aria-selected="true">Sky</button>
          <button class="view-tab" id="tab-map" role="tab" aria-controls="view-map" aria-selected="false">Map</button>
        </span>
        <span id="tracker-chip" class="chip">idle</span>
      </div>

      <div id="view-sky" class="view" role="tabpanel" aria-labelledby="tab-sky">
        <canvas id="skyplot"></canvas>
        <div class="sky-legend">
          <span class="key"><span class="key-line"></span>Pass track</span>
          <span class="key"><span class="key-dot"></span>Satellite</span>
          <span class="key"><span class="key-cross">+</span>Antenna</span>
        </div>
      </div>

      <div id="view-map" class="view" role="tabpanel" aria-labelledby="tab-map" hidden>
        <canvas id="worldmap"></canvas>
        <div class="sky-legend">
          <span class="key"><span class="key-line ahead"></span>Projected path</span>
          <span class="key"><span class="key-line behind"></span>Ground track</span>
          <span class="key"><span class="key-line inview"></span>In view</span>
          <span class="key"><span class="key-sched"></span>Scheduled</span>
          <span class="key"><span class="key-ring"></span>Est. range</span>
          <span class="key"><span class="key-station"></span>Station</span>
          <span id="map-count" class="dim"></span>
        </div>
      </div>

      <div id="tracked-info"></div>
      <div id="passes-box">
        <div class="panel-title">
          <span id="passes-title">Upcoming passes</span>
          <span class="sched-controls">
            <span id="sched-next" class="dim small-text"></span>
            <button id="btn-sched" class="btn small" hidden>Auto-track</button>
          </span>
        </div>
        <div id="pass-list" class="scroll"></div>
      </div>
    </section>

    <section class="panel" id="ctl-panel">
      <div class="panel-title"><span>Rotator</span><span id="rot-moving" class="chip">stopped</span></div>
      <div class="readouts">
        <div class="readout"><label>Azimuth</label><div id="rd-az" class="big">—</div><div id="rd-az-t" class="dim small-text"></div></div>
        <div class="readout"><label>Elevation</label><div id="rd-el" class="big">—</div><div id="rd-el-t" class="dim small-text"></div></div>
      </div>
      <div id="rot-status" class="status-banner" hidden>
        <span id="rot-status-text"></span>
        <button id="btn-clear-fault" class="btn small" hidden>Clear fault</button>
      </div>
      <div id="rot-fault" class="fault"></div>
      <div id="wrap-warning" class="warn-text"></div>

      <div class="jog-grid">
        <span></span><button class="btn jog" data-daz="0" data-del="5">El +5</button><span></span>
        <button class="btn jog" data-daz="-5" data-del="0">Az −5</button>
        <button class="btn jog" data-daz="0" data-del="0.5">El +0.5</button>
        <button class="btn jog" data-daz="5" data-del="0">Az +5</button>
        <button class="btn jog" data-daz="-0.5" data-del="0">Az −0.5</button>
        <button class="btn jog" data-daz="0" data-del="-5">El −5</button>
        <button class="btn jog" data-daz="0.5" data-del="0">Az +0.5</button>
      </div>

      <form id="goto-form" class="goto-row">
        <input id="goto-az" type="number" step="0.1" placeholder="Az °" required>
        <input id="goto-el" type="number" step="0.1" placeholder="El °" required>
        <button class="btn" type="submit">Goto</button>
      </form>

      <div class="button-row">
        <button id="btn-stop" class="btn danger">Stop</button>
        <button id="btn-estop" class="btn estop" title="Cut motion immediately. Requires re-homing afterwards.">E-STOP</button>
        <button id="btn-park" class="btn">Park</button>
        <button id="btn-home" class="btn">Home</button>
        <button id="btn-untrack" class="btn">Stop tracking</button>
      </div>

      <div class="doppler-section">
        <div class="panel-title"><span>2 m doppler</span><span id="doppler-state" class="chip">idle</span></div>
        <form id="doppler-form">
          <div class="freq-row"><span class="dir">TX</span><input id="dop-up" type="number" step="0.001" min="144" max="148" required> <span class="dim small-text">MHz</span></div>
          <div class="freq-row"><span class="dir">RX</span><input id="dop-down" type="number" step="0.001" min="144" max="148" required> <span class="dim small-text">MHz</span></div>
          <button class="btn small" type="submit">Set frequencies</button>
        </form>
        <table class="freq-table" id="doppler-table"></table>
      </div>

      <div class="doppler-section" id="rig-section" hidden>
        <div class="panel-title"><span>Radio</span><span id="rig-state" class="chip">off</span></div>
        <div id="rig-error" class="fault"></div>
        <table class="freq-table" id="rig-table"></table>
        <div class="button-row">
          <button id="btn-rig-toggle" class="btn small">Enable tuning</button>
        </div>
      </div>

      <div class="doppler-section" id="xpndr-section" hidden>
        <div class="panel-title"><span>Transponders</span></div>
        <div id="doppler-box"></div>
      </div>
    </section>
  </main>

  <script src="/geo.js"></script>
  <script src="/app.js"></script>
</body>
</html>
